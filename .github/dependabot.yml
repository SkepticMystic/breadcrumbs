version: 2
updates:
  # JS/TS dependencies (bun.lock + package.json)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      js-dependencies:
        patterns: ["*"]
    ignore:
      # TypeScript 7 is not supported by svelte-check or typescript-eslint yet.
      # The bump was merged once and broke `bun run build` on main; reverted in
      # PR #741. Drop this entry only after confirming both tools claim TS7
      # support -- minor/patch updates within v6 still come through.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Rust/WASM graph engine
  - package-ecosystem: "cargo"
    directory: "/wasm"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-dependencies:
        patterns: ["*"]

  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
